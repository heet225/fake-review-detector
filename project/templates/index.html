<!DOCTYPE html>
<html>
<head>
    <title>Fake Review Detector</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 40px; }
        .container { background: white; padding: 20px; border-radius: 10px; width: 400px; margin: auto; }
        textarea { width: 100%; height: 100px; padding: 10px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        .result { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fake Review Detector</h1>
        <form method="POST">
            <textarea name="review" placeholder="Enter your review here..." required></textarea><br><br>
            <button type="submit">Check Review</button>
        </form>
        {% if prediction %}
            <div class="result">Prediction: {{ prediction }}</div>
        {% endif %}
    </div>
</body>
</html>
